<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ytRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E2D"/>
      <stop offset="100%" stop-color="#B40A14"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base YouTube styled card -->
  <rect x="10" y="14" width="108" height="100" rx="26" ry="26" fill="url(#ytRedGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle inner border -->
  <rect x="10" y="14" width="108" height="100" rx="26" ry="26" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Play button triangle -->
  <polygon points="50,42 88,64 50,86" fill="#FFFFFF"/>

  <!-- Anti-ad diagonal slash -->
  <line x1="98" y1="26" x2="30" y2="102" stroke="#18181B" stroke-width="12" stroke-linecap="round"/>
  <line x1="98" y1="26" x2="30" y2="102" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
</svg>
